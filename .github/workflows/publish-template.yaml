name: Test and Publish Coder Template

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      TEMPLATE_NAME: "debian-vm"
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
            authkey: ${{ secrets.TAILSCALE_CI_AUTHKEY }}
            ping: coder
        
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Terraform secrets file
        run: |
          cat > secrets.auto.tfvars <<EOF
          tailscale_auth_key = "${{ secrets.TAILSCALE_AUTH_KEY }}"
          EOF

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest

      - name: Set up Coder CLI
        uses: coder/setup-action@v1
        with:
          access_url: "http://coder.tail4ef781.ts.net:7080"
          coder_session_token: ${{ secrets.CODER_SESSION_TOKEN }}

      - name: Validate Terraform template
        run: terraform init && terraform validate

      - name: Get short commit SHA to use as template version name
        id: name
        run: echo "version_name=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get latest commit title to use as template version description
        id: message
        run:
          echo "pr_title=$(git log --format=%s -n 1 ${{ github.sha }})" >> $GITHUB_OUTPUT

      - name: Push template to Coder
        run: |
          pwd
          ls -la
          ls -la "$GITHUB_WORKSPACE"/*.tf
          coder templates push "$TEMPLATE_NAME" --directory "$GITHUB_WORKSPACE" --activate=false --name ${{ steps.name.outputs.version_name }} --message "${{ steps.message.outputs.pr_title }}" --yes

      - name: Promote template version
        if: success()
        run: |
          coder template version promote --template=$TEMPLATE_NAME --template-version=${{ steps.name.outputs.version_name }} --yes
